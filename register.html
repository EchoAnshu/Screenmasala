<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ScreenMasala</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">
        <img src="assets/images/logo.png" alt="ScreenMasala">
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="movies.html">Movies</a>
        <a href="tvshows.html">TV Shows</a>
        <a href="search.html">Search</a>
        <a href="watchlist.html">♡</a>
        <a href="profile.html" title="Profile" aria-label="Profile">👤</a>
    </nav>
</header>

<main class="auth-page">

    <div class="auth-box">
        <p class="auth-label">JOIN SCREENMASALA</p>
        <h1>Create Account</h1>

        <form id="registerForm">

            <input
                type="text"
                id="registerName"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="registerEmail"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="registerPassword"
                placeholder="Password"
                required
            >

            <input
                type="password"
                id="registerConfirm"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">Create Account</button>

        </form>

        <p class="auth-bottom">Already have an account?
            <a href="login.html">Login</a>
        </p>
    </div>

</main>

<footer class="footer">
    <p>© 2026 ScreenMasala. All Rights Reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
